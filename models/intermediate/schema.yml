version: 2

models:
  - name: int_orders_joined
    description: "Orders joined with order items — one row per order item"
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Complete', 'Cancelled', 'Returned', 'Processing', 'Shipped']
      - name: order_item_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Complete', 'Cancelled', 'Returned', 'Processing', 'Shipped']

  - name: int_user_orders
    description: "Users enriched with lifetime order aggregations — one row per user"
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: lifetime_order_cnt
        tests:
          - not_null
      - name: total_return_cnt
        tests:
          - not_null

  - name: int_product_inventory
    description: "Products enriched with inventory summary — one row per product"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: int_funnel_events
    description: "Events with funnel stage assignments and session conversion flag"
    columns:
      - name: session_id
        tests:
          - not_null
      - name: event_at
        tests:
          - not_null
      - name: funnel_stage
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
                quote: false
      - name: session_converted
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
