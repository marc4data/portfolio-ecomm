version: 2

sources:
  - name: thelook
    database: portfolio-thelook
    schema: thelook_raw
    description: "TheLook eCommerce public dataset — fictional online clothing retailer"
    tables:
      - name: orders
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: user_id
            tests:
              - not_null
          - name: status
            tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['Complete', 'Cancelled', 'Returned', 'Processing', 'Shipped', 'Product',]

      - name: order_items
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: order_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook', 'orders')
                    field: order_id
          - name: product_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook', 'products')
                    field: id

      - name: users
        columns:
          - name: id
            tests:
              - unique
              - not_null

      - name: products
        columns:
          - name: id
            tests:
              - unique
              - not_null

      - name: inventory_items
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: product_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook', 'products')
                    field: id
          - name: product_distribution_center_id
            tests:
              - not_null
      - name: events
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: user_id
          - name: event_type
            tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['home', 'department', 'product', 'cart', 'purchase', 'cancel']

      - name: distribution_centers
        columns:
          - name: id
            tests:
              - unique
              - not_null